<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

: "diagrams.js", "kind": "module", "language": "javascript", "loc": 102, "file": "apps/geometrie/diagrams.js", "description": "Dieser Knoten zeichnet die Konstruktionsbilder der Geometrie-Werkstatt, etwa zur Mittelsenkrechten (perpDiagram), Winkelhalbierenden (bisectorDiagram) und zum Thaleskreis (thalesDiagram). Alle Punkte werden berechnet, nicht von Hand eingetragen. Er ruft die Hilfsfunktionen aus core/js/svg.js und apps/geometrie/geom.js auf und liefert fertige SVG-Grafiken. Aufgerufen wird er von apps/geometrie/logic.js. Die Datei hat 102 Zeilen. Wie die Bilder beim Lernen erscheinen, ist im Paket nicht belegt."}, {"id": "apps/geometrie/geom.js", "name": "geom.js", "kind": "module", "language": "javascript", "loc": 33, "file": "apps/geometrie/geom.js"}, {"id": "apps/geometrie/logic.js", "name": "logic.js", "kind": "module", "language": "javascript", "loc": 4, "file": "apps/geometrie/logic.js"}, {"id": "apps/geometrie/main.js", "name": "main.js", "kind": "module", "language": "javascript", "loc": 3, "file": "apps/geometrie/main.js"}, {"id": "scr:apps/geometrie/index.html", "name": "apps/geometrie/index.html", "kind": "screen", "language": "html", "loc": 14, "file": "apps/geometrie/index.html"}]}, {"id": "dom:app:informatik", "name": "App informatik", "kind": "domain", "children": [{"id": "apps/informatik/builders.js", "name": "builders.js", "kind": "module", "language": "javascript", "loc": 254, "file": "apps/informatik/builders.js", "description": "Dieser Knoten erzeugt die Aufgaben der Informatik-App: Fragen zu Stellenwerten, Bin\u00e4rzahlen und Addition im Quiz-Format, aus Zufallszahlen gebaut. Er ruft die Hilfsfunktionen aus ui.js, die Fragenbausteine aus questions.js und die Zahlenhelfer aus numbers.js auf. Aufgerufen wird er von logic.js und von tests/informatik.test.js. Die Seitenliste bekommt er \u00fcber init aus dem Manifest. Der Ausschnitt zeigt nur 150 von 254 Zeilen, deshalb ist unklar, wie die einzelnen Fragen im Detail aufgebaut sind."}, {"id": "apps/informatik/diagrams.js", "name": "diagrams.js", "kind": "module", "language": "javascript", "loc": 109, "file": "apps/informatik/diagrams.js", "description": "Das Modul diagrams.js (109 Zeilen) liefert die Bilder der Zahlenwerkstatt im Bereich Informatik: eine Stellenwert-Tafel, eine Lampenreihe, eine bin\u00e4re Addition, Hex-Zahlen und das Zerlegen von Bits in Vierergruppen. Die Lernende sieht so, wie sich Zahlen aus Stellenwerten zusammensetzen. Das Modul nutzt core/js/svg.js f\u00fcr die Zeichenbausteine und apps/informatik/numbers.js f\u00fcr Stellenwerte und Umrechnung. Aufgerufen wird es von apps/informatik/logic.js. Es liefert fertigen SVG-Text zur\u00fcck, und die Verbindungen zeigen keine Speicher- oder Datenzugriffe. Das Paket zeigt nicht, wo dieser Text auf dem Bildschirm erscheint."}, {"id": "apps/informatik/logic.js", "name": "logic.js", "kind": "module", "language": "javascript", "loc": 5, "file": "apps/informatik/logic.js"}, {"id": "apps/informatik/main.js", "name": "main.js", "kind": "module", "language": "javascript", "loc": 3, "file": "apps/informatik/main.js"}, {"id": "apps/informatik/numbers.js", "name": "numbers.js", "kind": "module", "language": "javascript", "loc": 83, "file": "apps/informatik/numbers.js", "description": "Der Baustein numbers.js (83 Zeilen) in der Informatik-App stellt Rechenhilfen f\u00fcr Bin\u00e4r- und Hexadezimalzahlen bereit: Stellenwerte wie 128, 64 und 32, Umrechnungsschritte, Erkl\u00e4rungen als Text und die Pr\u00fcfung von Eingaben \u00fcber normInput. Er ruft nur esc aus core/js/ui.js auf. Aufgerufen wird er von builders.js, diagrams.js, theory.js und tests/informatik.test.js. Das Paket zeigt keine Lese- oder Schreibzugriffe auf gespeicherte Daten, deshalb l\u00e4sst sich zur Speicherung nichts sagen."}, {"id": "apps/informatik/smoke.mjs", "name": "smoke.mjs", "kind": "module", "language": "javascript", "loc": 22, "file": "apps/informatik/smoke.mjs"}, {"id": "apps/informatik/theory.js", "name": "theory.js", "kind": "module", "language": "javascript", "loc": 137, "file": "apps/informatik/theory.js", "description": "Dieser Baustein zeichnet die Theorie-Seite der Informatik-App. Die Lernenden sehen Lektion und Merkzettel, dazu einen Knopf \u201e\u00dcbung starten\u201c mit 8 Aufgaben. Je nach Seite gibt es ein Spielzeug zum Ausprobieren, zum Beispiel eine Lampen-Tafel f\u00fcr Bin\u00e4rzahlen oder einen Schieberegler f\u00fcr Hex-Zahlen. Aufgerufen wird er von apps/informatik/logic.js. F\u00fcr Darstellung und Zahlenrechnung nutzt er core/js/ui.js, core/js/lesson.js und apps/informatik/numbers.js. Der Ausschnitt zeigt keine Speicherzugriffe, ob Ergebnisse gespeichert werden, ist aus dem Ausschnitt nicht ersichtlich."}, {"id": "scr:apps/informatik/index.html", "name": "apps/informatik/index.html", "kind": "screen", "language": "html", "loc": 14, "file": "apps/informatik/index.html"}]}, {"id": "dom:app:mathe", "name": "App mathe", "kind": "domain", "children": [{"id": "apps/mathe/builders.js", "name": "builders.js", "kind": "module", "language": "javascript", "loc": 291, "file": "apps/mathe/builders.js", "description": "Diese Datei erstellt die Fragen der Mathe-App aus Zufallszahlen. Jede Aufgabe kennt typische Fehlerwege und bietet sie als falsche Antworten an. Sie ruft Fragebausteine aus core/js/questions.js, Anzeigehilfen aus core/js/ui.js und Rechenhilfen aus apps/mathe/math.js auf. Aufgerufen wird sie von apps/mathe/logic.js und von tests/mathe.test.js. Die Seitenliste und die Aufgabendaten erh\u00e4lt sie \u00fcber init, bevor die erste Runde entsteht. Der Ausschnitt endet bei Zeile 150; zu den restlichen Funktionen sagt er nichts."}, {"id": "apps/mathe/diagrams.js", "name": "diagrams.js", "kind": "module", "language": "javascript", "loc": 126, "file": "apps/mathe/diagrams.js", "description": "Dieser Baustein zeichnet die Diagramme der Mathe-App, etwa Zahlenstrahl, Waage, Prozentbalken oder Urne, und berechnet dabei alle Zahlen selbst, statt sie von Hand einzutragen. Er ruft die Zeichenhilfe svg aus core/js/svg.js auf und fmt aus apps/mathe/math.js, um Zahlen zu formatieren. Aufgerufen wird er von apps/mathe/logic.js. Der Auszug nennt keine weiteren Verbindungen, daher sind Speicherzugriffe und Aufrufer au\u00dferhalb der Mathe-App darin nicht belegt."}, {"id": "apps/mathe/logic.js", "name": "logic.js", "kind": "module", "language": "javascript", "loc": 5, "file": "apps/mathe/logic.js"}, {"id": "apps/mathe/main.js", "name": "main.js", "kind": "module", "language": "javascript", "loc": 3, "file": "apps/mathe/main.js"}, {"id": "apps/mathe/math.js", "name": "math.js", "kind": "module", "language": "javascript", "loc": 15, "file": "apps/mathe/math.js"}, {"id": "scr:apps/mathe/index.html", "name": "apps/mathe/index.html", "kind": "screen", "language": "html", "loc": 14, "file": "apps/mathe/index.html"}]}, {"id": "dom:bootstrap", "name": "Start und Inhalte", "kind": "domain", "children": [{"id": "core/js/appconfig.js", "name": "appconfig.js", "kind": "module", "language": "javascript", "loc": 50, "file": "core/js/appconfig.js", "description": "Diese Datei setzt die Inhalte einer Lern-App (Seiten, Lektionen, badges) mit ihrer Logik zur Konfiguration zusammen, die shell.js anzeigt. Dabei werden Diagramme zu SVG aufgel\u00f6st und die Regeln der badges mit evaluateRule gepr\u00fcft. Sie ruft validate.js zur Pr\u00fcfung des Inhaltspakets, rules.js und theory.js auf. Aufgerufen wird sie von boot.js sowie von den Tests tests/core-content.test.js und tests/helpers.js. Als reine Funktion ohne Browser-Zugriff ist sie testbar. Das Packet zeigt den Aufrufweg, nicht die Anzeige selbst."}, {"id": "core/js/boot.js", "name": "boot.js", "kind": "module", "language": "javascript", "loc": 24, "file": "core/js/boot.js"}, {"id": "core/js/content.js", "name": "content.js", "kind": "module", "language": "javascript", "loc": 62, "file": "core/js/content.js", "description": "Dieser Baustein liefert einer App ihre Lerninhalte: Seiten, Lektionen, Troph\u00e4en und Aufgabenpools. Heute holt er die JSON-Dateien (manifest.json, lessons.json, badges.json, data.json) aus content/\u003cappId\u003e/ \u00fcber createStaticSource. Er nutzt db.js f\u00fcr den lokalen Speicher, pr\u00fcft Pakete \u00fcber validate.js und wird von boot.js aufgerufen, au\u00dferdem von zwei Testdateien. createHttpSource soll die Inhalte sp\u00e4ter aus einer Datenbank-API holen, withCache legt geladene Inhalte lokal ab und liefert sie bei fehlendem Netz."}, {"id": "core/js/validate.js", "name": "validate.js", "kind": "module", "language": "javascript", "loc": 47, "file": "core/js/validate.js", "description": "Die Datei core/js/validate.js pr\u00fcft ein Inhaltspaket (Bundle) beim Laden, damit die App nicht halb kaputt aussieht, wenn Daten aus einer Datenbank fehlerhaft sind. Sie kontrolliert Manifest, Lektionen, Troph\u00e4en und die Sicherheit von Material-Links, also relative Pfade. F\u00fcr die Troph\u00e4en-Regeln ruft sie core/js/rules.js auf. Aufgerufen wird sie von core/js/appconfig.js, core/js/content.js sowie den Tests tests/content.test.js und tests/core-content.test.js. Sie liest nur das \u00fcbergebene Paket und schreibt nichts. Die strenge Pr\u00fcfung per JSON-Schema l\u00e4uft laut Kommentar in den Tests, nicht hier."}]}, {"id": "dom:entry", "name": "Einstieg (Startseite)", "kind": "domain", "children": [{"id": "dashboard.js", "name": "dashboard.js", "kind": "module", "language": "javascript", "loc": 67, "file": "dashboard.js", "description": "Der Knoten dashboard.js (67 Zeilen) ist das Dashboard, also die \u00dcbersicht aller Apps f\u00fcr die Lernenden. Er liest Profil und Fortschritt aus dem Browser-Speicher und zeigt sie als Kacheln mit Tagesziel und Troph\u00e4en. Daf\u00fcr nutzt er core/js/ui.js, core/js/mascot.js, core/js/store.js, core/js/profile.js und registry.js. Aufgerufen wird er von index.html. Schreibende Verbindungen sind im Paket nicht verzeichnet, und die Aufrufe sind nur als Namen belegt; ob und wie gespeichert wird, ist daher nicht vollst\u00e4ndig belegt."}, {"id": "registry.js", "name": "registry.js", "kind": "module", "language": "javascript", "loc": 64, "file": "registry.js", "description": "Die Datei registry.js ist das Verzeichnis aller Lern-Apps und umfasst 64 Zeilen. Jede App hat dort einen Eintrag mit Kennung, Fach, Titel, Beschreibung, Link und Status (live oder soon). Das Dashboard in dashboard.js baut aus dieser Liste die Kacheln der Startseite index.html. Die Datei selbst nutzt nichts anderes. Aufgerufen wird sie von dashboard.js, scripts/smoke.mjs sowie den Tests tests/contract.test.js, tests/pages.test.js und tests/registry.test.js, und tests/content.test.js greift per dispatch darauf zu. Lese- oder Schreibzugriffe auf Speicher oder Dateien zeigt das Paket nicht; dazu fehlen Angaben."}, {"id": "scr:index.html", "name": "index.html", "kind": "screen", "language": "html", "loc": 24, "file": "index.html"}]}, {"id": "dom:lessons", "name": "Lektionen und Diagramme", "kind": "domain", "children": [{"id": "core/js/lesson.js", "name": "lesson.js", "kind": "module", "language": "javascript", "loc": 67, "file": "core/js/lesson.js", "description": "Die Datei core/js/lesson.js (67 Zeilen) baut die Theorie-Seiten (Lektionen). Der obere Teil (lessonTop) zeigt Ziel, \u201eIn 30 Sekunden\u201c, einen Vergleich aus dem Alltag und ein Bild. Der untere Teil (lessonBottom) zeigt das Beispiel Schritt f\u00fcr Schritt, die typische Falle, den Merksatz und den Mini-Check. Mit wireLesson werden Schritte und Mini-Check anklickbar und geben sofort R\u00fcckmeldung. Die Datei nutzt ui.js f\u00fcr die Textmaskierung (esc) und mascot.js f\u00fcr die Figur. Aufgerufen wird sie von core/js/theory.js sowie den Theorie-Dateien der Apps franzoesisch-verben und informatik."}, {"id": "core/js/svg.js", "name": "svg.js", "kind": "module", "language": "javascript", "loc": 13, "file": "core/js/svg.js"}, {"id": "core/js/theory.js", "name": "theory.js", "kind": "module", "language": "javascript", "loc": 18, "file": "core/js/theory.js"}, {"id": "core/js/tracks.js", "name": "tracks.js", "kind": "module", "language": "javascript", "loc": 7, "file": "core/js/tracks.js"}]}, {"id": "dom:persistence", "name": "Speicher", "kind": "domain", "children": [{"id": "core/js/db.js", "name": "db.js", "kind": "module", "language": "javascript", "loc": 128, "file": "core/js/db.js", "description": "Die Datei core/js/db.js ist der Speicher der Lern-App im Browser. Sie h\u00e4lt beliebige Dokumente unter einem Schl\u00fcssel und ein Protokoll aus Ereignissen, etwa beendete Runden. Sie liest und schreibt in IndexedDB, ausweichen kann sie auf localStorage. Aufgerufen wird sie von core/js/content.js, core/js/shell.js, core/js/store.js und core/js/views/backup.js, au\u00dferdem vom Test tests/db.test.js. Der Ausschnitt zeigt die Speicherwege, nicht, wie die Aufrufer die Daten nutzen."}, {"id": "core/js/store.js", "name": "store.js", "kind": "module", "language": "javascript", "loc": 54, "file": "core/js/store.js", "description": "Die Datei store.js (54 Zeilen) verwaltet den Zustand einer Einheit, etwa das Profil oder den Stand einer App. Der Zustand ist im Speicher schnell lesbar und wird in der Browser-Datenbank dauerhaft gesichert: createStore l\u00e4dt oder legt ihn an, save() schreibt im Hintergrund. Neue Standardfelder werden beim Laden erg\u00e4nzt, ohne dass bestehende Daten verloren gehen. Die Datei ruft core/js/db.js auf. Aufgerufen wird sie von core/js/profile.js und dashboard.js, und tests/db.test.js pr\u00fcft sie \u00fcber dispatch."}]}, {"id": "dom:rounds", "name": "Rundenmotor", "kind": "domain", "children": [{"id": "core/js/blitz.js", "name": "blitz.js", "kind": "module", "language": "javascript", "loc": 77, "file": "core/js/blitz.js", "description": "Der Blitz-Modus in core/js/blitz.js (77 Zeilen) gibt dem Lerner eine Runde von 45 Sekunden mit Auswahlfragen, bei der jede richtige Antwort 5 XP mal einen Combo-Faktor bringt. Ab drei richtigen Antworten in Folge zeigt die Anzeige den Combo-Stand. Die Datei nutzt ui.js, icons.js und profile.js und wird von shell.js aufgerufen. Sie bucht Punkte \u00fcber addXP auf das Profil und speichert \u00fcber ctx.save(). Sie l\u00e4uft als eigener Ablauf neben quiz.js. Die Unterlagen zeigen nicht, wie shell.js die Ergebnisse weiterverwendet."}, {"id": "core/js/qtypes.js", "name": "qtypes.js", "kind": "module", "language": "javascript", "loc": 174, "file": "core/js/qtypes.js", "description": "Dieser Baustein legt fest, wie eine Lernfrage aussieht, wie ihre Antwort gepr\u00fcft wird und wie sie auf Klicks reagiert. Der gelesene Teil nennt die Typen choice (Auswahl), type (Eintippen) und match (Zuordnen). Er nutzt core/js/ui.js. Aufgerufen wird er von core/js/quiz.js sowie von tests/helpers.js und tests/qtypes.test.js. Das Paket zeigt nur den Quelltext des Registers; wie quiz.js die Ergebnisse danach weiterverarbeitet, ist daraus nicht zu erkennen."}, {"id": "core/js/questions.js", "name": "questions.js", "kind": "module", "language": "javascript", "loc": 22, "file": "core/js/questions.js"}, {"id": "core/js/quiz.js", "name": "quiz.js", "kind": "module", "language": "javascript", "loc": 196, "file": "core/js/quiz.js", "description": "Der Quiz-Motor (core/js/quiz.js, 196 Zeilen) f\u00fchrt die \u00dcbungsrunden aller Lern-Apps durch. Er zeigt Fragen, wertet Antworten aus und vergibt XP, Combo-Bonus, Herzen und Feedback. Wer eine Frage falsch beantwortet, bekommt sie am Ende der Runde noch einmal (au\u00dfer im Endgegner); die Wiederholung bringt 5 XP. Im Endgegner gibt es 3 Herzen, sonst 5. Der Motor kennt keinen Lernstoff. Er nutzt ui.js, icons.js, mascot.js, profile.js und qtypes.js, und shell.js ruft ihn auf. Die Quelle lag nur bis Zeile 150 vor, die Auswertung am Rundenende ist daher nicht belegt."}]}, {"id": "dom:rules", "name": "Spielregeln", "kind": "domain", "children": [{"id": "core/js/profile.js", "name": "profile.js", "kind": "module", "language": "javascript", "loc": 79, "file": "core/js/profile.js", "description": "Das Modul profile.js ist die Spielelogik, die alle Lern-Apps gleich nutzen: Es rechnet Punkte (XP), Niveau, Tagesziel und Lernserie und entscheidet, welche Seite als N\u00e4chstes ge\u00fcbt werden sollte, etwa wenn sie nach 3 Tagen zum Auffrischen f\u00e4llig ist. Daf\u00fcr ruft es store.js auf, um Profil- und App-Daten zu \u00f6ffnen. Aufgerufen wird es von quiz.js, rounds.js, blitz.js, shell.js, den Ansichten views/home.js und views/result.js sowie von dashboard.js. Aus dem Ausschnitt geht nur hervor, welche Module es aufrufen, nicht im Detail, welche Felder es liest oder schreibt."}, {"id": "core/js/rounds.js", "name": "rounds.js", "kind": "module", "language": "javascript", "loc": 44, "file": "core/js/rounds.js"}, {"id": "core/js/rules.js", "name": "rules.js", "kind": "module", "language": "javascript", "loc": 48, "file": "core/js/rules.js", "description": "Die Datei rules.js (core/js/rules.js) beschreibt die Troph\u00e4en-Regeln der Lernapps als reine Daten, etwa \u201eSeite hat mindestens einen Stern\u201c oder \u201eRunde ohne Fehler\u201c, und pr\u00fcft, ob eine Regel erf\u00fcllt ist. Unbekannte Regeltypen f\u00fchren zu einem Fehler. Sie nutzt selbst keine anderen Bausteine. Aufgerufen wird sie von core/js/appconfig.js und core/js/validate.js sowie von den Tests tests/content.test.js und tests/core-content.test.js. Welche Daten genau \u00fcbergeben werden und ob etwas gespeichert wird, zeigt der Auszug nicht."}]}, {"id": "dom:shared", "name": "Gemeinsame Helfer", "kind": "domain", "children": [{"id": "core/js/confetti.js", "name": "confetti.js", "kind": "module", "language": "javascript", "loc": 14, "file": "core/js/confetti.js"}, {"id": "core/js/icons.js", "name": "icons.js", "kind": "module", "language": "javascript", "loc": 10, "file": "core/js/icons.js"}, {"id": "core/js/mascot.js", "name": "mascot.js", "kind": "module", "language": "javascript", "loc": 17, "file": "core/js/mascot.js"}, {"id": "core/js/mathkit.js", "name": "mathkit.js", "kind": "module", "language": "javascript", "loc": 37, "file": "core/js/mathkit.js"}, {"id": "core/js/ui.js", "name": "ui.js", "kind": "module", "language": "javascript", "loc": 18, "file": "core/js/ui.js"}]}, {"id": "dom:shell", "name": "Shell und Ansichten", "kind": "domain", "children": [{"id": "core/js/shell.js", "name": "shell.js", "kind": "module", "language": "javascript", "loc": 152, "file": "core/js/shell.js", "description": "Die Datei shell.js bildet das Ger\u00fcst jeder Lern-App: Sie zeigt die Kopfzeile mit Niveau, XP und Serie und wechselt zwischen Startseite, Theorie, \u00dcbungsrunde, Blitz und Ergebnis. Daf\u00fcr ruft sie die Ansichten views/home.js, views/result.js und views/backup.js auf, die \u00dcbungen laufen \u00fcber quiz.js und blitz.js, die Auswertung \u00fcber rounds.js. Profil und App-Fortschritt kommen \u00fcber profile.js, das Protokoll jeder Runde \u00fcber db.js. Aufgerufen wird sie nur von boot.js. Der Auszug zeigt die Aufrufe, aber nicht, welche Daten dabei genau gelesen oder geschrieben werden."}, {"id": "core/js/views/backup.js", "name": "backup.js", "kind": "module", "language": "javascript", "loc": 14, "file": "core/js/views/backup.js"}, {"id": "core/js/views/home.js", "name": "home.js", "kind": "module", "language": "javascript", "loc": 65, "file": "core/js/views/home.js", "description": "Dieser Baustein zeichnet die Startseite der Lernapp mit Tagesziel-Ring, Lernpfad, Spielmodi, Sammelalbum und Troph\u00e4en. Er arbeitet als reine Funktion, die aus dem \u00fcbergebenen Stand HTML erzeugt, und greift laut Kopfkommentar weder auf das DOM noch auf den Speicher zu (Zeile 1). F\u00fcr die Darstellung nutzt er ui.js, icons.js, mascot.js, tracks.js und profile.js. Aufgerufen wird er von shell.js, gepr\u00fcft von tests/views.test.js. Welche Daten genau in den Stand flie\u00dfen, bleibt offen, weil das Paket nur die Verbindungen und den Anfang des Quelltexts enth\u00e4lt."}, {"id": "core/js/views/result.js", "name": "result.js", "kind": "module", "language": "javascript", "loc": 35, "file": "core/js/views/result.js"}]}, {"id": "dom:tests", "name": "Tests und Smoke-Test", "kind": "domain", "children": [{"id": "scripts/smoke.mjs", "name": "smoke.mjs", "kind": "module", "language": "javascript", "loc": 181, "file": "scripts/smoke.mjs", "description": "Das Skript scripts/smoke.mjs ist ein automatischer Probelauf f\u00fcr die Lernapps: Es \u00f6ffnet jede live geschaltete App aus registry.js in einer simulierten Browserumgebung (jsdom) und spielt Startseite, Lektionen, \u00dcbungsrunden, Endgegner und die Browser-Datenbank durch. Daf\u00fcr nutzt es Hilfsfunktionen aus tests/helpers.js, etwa loadAppConfig, und l\u00e4dt App-eigene Pr\u00fcfungen, sofern vorhanden. Im Paket ist kein aufrufender Knoten verzeichnet. Der Auszug umfasst nur einen Teil der 181 Zeilen."}, {"id": "tests/content.test.js", "name": "content.test.js", "kind": "module", "language": "javascript", "loc": 57, "file": "tests/content.test.js", "description": "Dieser Knoten ist ein Pr\u00fcfprogramm f\u00fcr die Lerninhalte. Er l\u00e4uft als Test, nicht im Browser, und pr\u00fcft alle Inhaltspakete in content/ gegen ein JSON-Schema mit Ajv sowie gegen Querverweise, die das Schema nicht kennt. Er nutzt tests/helpers.js, core/js/rules.js und core/js/validate.js und ist per Dispatch mit registry.js und core/js/validate.js verbunden. Eingehende Verbindungen gibt es keine. Der Quelltext zeigt nicht, wie ein Fehler die Lernenden erreicht."}, {"id": "tests/contract.test.js", "name": "contract.test.js", "kind": "module", "language": "javascript", "loc": 32, "file": "tests/contract.test.js"}, {"id": "tests/core-content.test.js", "name": "core-content.test.js", "kind": "module", "language": "javascript", "loc": 112, "file": "tests/core-content.test.js", "description": "F\u00fcr die Lernenden ist diese Datei unsichtbar: Sie ist eine Pr\u00fcfung, die sicherstellt, dass der Inhalts-Unterbau der Apps richtig arbeitet. Getestet werden Troph\u00e4en-Regeln, die Paketpr\u00fcfung, die Inhaltsquellen (statisch, HTTP und Cache) und der Aufbau der App-Konfiguration. Daf\u00fcr ruft sie rules.js, validate.js, content.js und appconfig.js auf sowie die Hilfsfunktionen diskFetch und diskSource aus tests/helpers.js. Im Paket gibt es keine eingehenden Verbindungen, daher ist nicht belegt, wer die Tests startet."}, {"id": "tests/db.test.js", "name": "db.test.js", "kind": "module", "language": "javascript", "loc": 74, "file": "tests/db.test.js", "description": "Diese Datei ist ein Pr\u00fcfprogramm f\u00fcr den Speicher der App, damit der Lernfortschritt nicht verloren geht. Sie testet, dass gespeicherte Daten nach dem erneuten Laden zur\u00fcckkommen, dass alte Daten um neue Felder erg\u00e4nzt werden, dass eine Migration bei neuer Version l\u00e4uft und dass Export und Import funktionieren. Ein weiterer Test pr\u00fcft, dass die App ohne IndexedDB im Arbeitsspeicher weiterl\u00e4uft. Die Datei nutzt diese Module: core/js/db.js f\u00fcr die Datenbank und core/js/store.js f\u00fcr den Speicher. Eingehend ruft sie kein anderer Knoten auf, sie dient also nur der Pr\u00fcfung."}, {"id": "tests/deutsch.test.js", "name": "deutsch.test.js", "kind": "module", "language": "javascript", "loc": 77, "file": "tests/deutsch.test.js", "description": "Dieser Knoten ist eine automatische Pr\u00fcfung f\u00fcr die Deutsch-App. Er stellt sicher, dass jede Aufgabe eine Erkl\u00e4rung hat und keine doppelt vorkommt, dass L\u00fccken-Aufgaben sich ausw\u00e4hlen und eintippen lassen, dass Runden g\u00fcltige Fragen liefern, dass Diagramme g\u00fcltiges SVG sind und dass die LRS-Seiten das Etikett tragen. Daf\u00fcr ruft er tests/helpers.js auf (assertValidQuestion, diskSource) sowie apps/deutsch/builders.js und apps/deutsch/diagrams.js. Kein anderer Knoten im Paket ruft tests/deutsch.test.js auf; die Datei ist ein node:test-Test."}, {"id": "tests/french.test.js", "name": "french.test.js", "kind": "module", "language": "javascript", "loc": 64, "file": "tests/french.test.js", "description": "Diese Testdatei pr\u00fcft die \u00dcbungslogik der Franz\u00f6sisch-Verbapp (apps/franzoesisch-verben), damit die \u00dcbungsfragen vor dem Einsatz gepr\u00fcft sind. Sie liest die Inhalte \u00fcber die Hilfsfunktion diskSource aus tests/helpers.js aus content/fr-verben/ und f\u00fcllt damit das Verbmodell apps/franzoesisch-verben/model.js. Sie nutzt au\u00dferdem die Aufgabenbauer in apps/franzoesisch-verben/builders.js. Gepr\u00fcft werden 8 Fragen pro Seite \u00fcber 200 Durchl\u00e4ufe, 12 Fragen f\u00fcr die Boss-Runde, 5 f\u00fcr die Quick-Runde und die Verbformen. Eingehend ist kein anderer Knoten angebunden. Der Ausschnitt zeigt nur die Tests, nicht die Lernansicht."}, {"id": "tests/geometrie.test.js", "name": "geometrie.test.js", "kind": "module", "language": "javascript", "loc": 77, "file": "tests/geometrie.test.js", "description": "Dieser Knoten ist ein Pr\u00fcfprogramm f\u00fcr die Geometrie-App und geh\u00f6rt nicht zu dem, was Lernende sehen. Er pr\u00fcft, ob die Rechenfunktionen f\u00fcr Umkreis und Inkreis stimmen, ob die Aufgaben-Erzeuger in POOLS richtige Antworten liefern und ob Winkel- und Ma\u00dfstabsaufgaben korrekt gerechnet sind. Daf\u00fcr ruft er geom.js und builders.js der Geometrie-App auf, l\u00e4dt Testdaten \u00fcber helpers.js und nutzt numCheck aus mathkit.js zur Zahlenpr\u00fcfung. Andere Knoten rufen diese Datei laut Paket nicht auf (keine eingehenden Verbindungen). Das Paket zeigt nicht, wie oft oder wann die Tests laufen."}, {"id": "tests/helpers.js", "name": "helpers.js", "kind": "module", "language": "javascript", "loc": 75, "file": "tests/helpers.js", "description": "Diese Datei ist ein gemeinsamer Pr\u00fcfbaustein f\u00fcr die Tests und f\u00fcr Sira unsichtbar. Sie \u00fcbersetzt die Vorgaben aus AGENTS.md in ausf\u00fchrbare Pr\u00fcfungen: Fragen, Lektionen und App-Konfigurationen werden gegen den App-Vertrag gepr\u00fcft. Daf\u00fcr ruft sie validateQuestion aus core/js/qtypes.js auf, createStaticSource aus core/js/content.js und buildConfig aus core/js/appconfig.js. Mehrere Test- und Pr\u00fcfdateien, etwa tests/content.test.js und scripts/smoke.mjs, importieren sie, unter den Nutzern taucht keine App-Datei auf. Die Funktion loadAppConfig liest Inhalte aus dem Repo, statt sie per fetch zu laden."}, {"id": "tests/informatik.test.js", "name": "informatik.test.js", "kind": "module", "language": "javascript", "loc": 67, "file": "tests/informatik.test.js", "description": "Dieser Knoten ist eine automatische Pr\u00fcfdatei f\u00fcr die App info-zahlen. Sie testet, ob Bin\u00e4r- und Hex-Umrechnungen (etwa 255 ergibt FF), die Eingabepr\u00fcfung und die Aufgabenerzeuger richtige Ergebnisse liefern; jeder Erzeuger muss 300 g\u00fcltige Fragen bauen. Sie ruft drei Module auf: apps/informatik/numbers.js, apps/informatik/builders.js und tests/helpers.js. Eingehend ist keine Verbindung vermerkt, kein anderer Knoten nutzt diese Datei. Sie greift also nicht in den Lernablauf ein, sondern sichert nur die Rechnungen der App ab."}, {"id": "tests/mathe.test.js", "name": "mathe.test.js", "kind": "module", "language": "javascript", "loc": 150, "file": "tests/mathe.test.js", "description": "Diese Datei ist ein automatischer Pr\u00fcfstand f\u00fcr die Mathe-App. Sie pr\u00fcft, ob Zahlen mit Minuszeichen und Komma richtig ausgegeben werden und ob Eingaben wie '-2,5' oder '-2.5' als richtig gelten. Au\u00dferdem erzeugt sie jede Aufgabenart 300-mal und rechnet die L\u00f6sung unabh\u00e4ngig nach. Daf\u00fcr ruft sie math.js (Rechenhilfen), builders.js (Aufgabenerzeuger) und helpers.js (Laden der Inhalte aus content/mathe/) auf. Andere Dateien rufen ihn laut Paket nicht auf. Der Quelltext endet im Paket bei Zeile 150, mitten im Kredit-Test."}, {"id": "tests/pages.test.js", "name": "pages.test.js", "kind": "module", "language": "javascript", "loc": 26, "file": "tests/pages.test.js"}, {"id": "tests/profile.test.js", "name": "profile.test.js", "kind": "module", "language": "javascript", "loc": 87, "file": "tests/profile.test.js", "description": "Die Datei tests/profile.test.js ist ein Pr\u00fcfprogramm f\u00fcr die Spielregeln der Lernapp: Erfahrungspunkte (XP) und Niveaus, Serie mit Gnadentag, Sterne je nach Genauigkeit, Combo-Faktor, Tagesziel und Auffrischen f\u00e4lliger Seiten, das 10 Bonus-XP bringt. Es pr\u00fcft daf\u00fcr core/js/profile.js und core/js/rounds.js und wird von keinem anderen Knoten im Paket aufgerufen. Das Paket zeigt nur die Tests, nicht den Code der beiden Module; wie die Regeln dort umgesetzt sind, bleibt offen."}, {"id": "tests/qtypes.test.js", "name": "qtypes.test.js", "kind": "module", "language": "javascript", "loc": 45, "file": "tests/qtypes.test.js", "description": "Diese Datei ist ein Pr\u00fcfprogramm und hat keinen direkten Kontakt zu Lernenden. Sie sichert die Fragetypen der Lernwerkstatt ab: Die Standardtypen sind angemeldet, eine Antwort wird als richtig, fast richtig (Akzent) oder falsch eingestuft, Auswahl- und Zuordnungsfragen starten und werden richtig bewertet, und eine Frage ohne Label wird abgelehnt. Zus\u00e4tzlich wird gepr\u00fcft, dass ein eigener Typ wie ja-nein ohne \u00c4nderung am Kern angemeldet werden kann. Sie nutzt nur core/js/qtypes.js; von keinem anderen Knoten wird sie genutzt. Wie und wann die Tests laufen, zeigt das Paket nicht."}, {"id": "tests/registry.test.js", "name": "registry.test.js", "kind": "module", "language": "javascript", "loc": 17, "file": "tests/registry.test.js"}, {"id": "tests/rounds.test.js", "name": "rounds.test.js", "kind": "module", "language": "javascript", "loc": 71, "file": "tests/rounds.test.js", "description": "Diese Testdatei pr\u00fcft, ob die Belohnungen nach einer \u00dcbungsrunde der App fr-verben stimmen. Sie kontrolliert, dass gescheiterte Runden keine Sterne bringen, dass ein Boss-Sieg 50 Bonus-XP bringt und dass die Blitz-Troph\u00e4e ab 10 Punkten vergeben wird. Daf\u00fcr ruft sie finalizeRound aus core/js/rounds.js auf, nutzt die Startwerte aus core/js/profile.js und l\u00e4dt die App-Inhalte \u00fcber tests/helpers.js. Niemand ruft diese Testdatei auf, das Packet zeigt keine eingehenden Verbindungen."}, {"id": "tests/views.test.js", "name": "views.test.js", "kind": "module", "language": "javascript", "loc": 53, "file": "tests/views.test.js", "description": "Diese Datei ist ein Pr\u00fcfskript f\u00fcr zwei Ansichten, die Lernende sehen: die Startseite und die Ergebnisansicht nach einer Runde. Die Tests sichern ab, dass alle Seiten erscheinen, der Endgegner gesperrt bleibt, Name und Material maskiert werden, das Zur\u00fccksetzen vorher nachfragt und 6 Seiten der LRS-F\u00f6rderung gekennzeichnet sind. Daf\u00fcr nutzt sie die Ansichten in core/js/views/home.js und core/js/views/result.js, dazu core/js/profile.js und tests/helpers.js. Keine andere Datei nutzt diese Datei. Der Auszug zeigt nur die Testf\u00e4lle, nicht die Ansichten selbst, daher bleibt offen, wie die Seiten genau aussehen."}]}, {"id": "dom:data", "name": "Datenspeicher", "kind": "domain", "children": [{"id": "ds:content-api", "name": "Inhalte-API (optional, Meta lw-content-api)", "kind": "datastore", "file": "core/js/boot.js"}, {"id": "ds:content:deutsch", "name": "Inhalte: deutsch", "kind": "datastore", "file": "content/deutsch"}, {"id": "ds:content:fr-verben", "name": "Inhalte: fr-verben", "kind": "datastore", "file": "content/fr-verben"}, {"id": "ds:content:geometrie", "name": "Inhalte: geometrie", "kind": "datastore", "file": "content/geometrie"}, {"id": "ds:content:info-zahlen", "name": "Inhalte: info-zahlen", "kind": "datastore", "file": "content/info-zahlen"}, {"id": "ds:content:mathe", "name": "Inhalte: mathe", "kind": "datastore", "file": "content/mathe"}, {"id": "ds:content:vorlage", "name": "Inhalte: vorlage", "kind": "datastore", "file": "content/vorlage"}, {"id": "ds:indexeddb", "name": "IndexedDB lernwerkstatt (docs, log)", "kind": "datastore", "file": "core/js/db.js"}, {"id":   natural: "#587a78", sql: "#3d6a5a" };
const EDGE_STYLE = {
  call:     { color: "rgba(201,182,144,0.30)", label: "calls" },
  dispatch: { color: "rgba(160,130,200,0.35)", label: "dynamic dispatch" },
  read:     { color: "rgba(91,160,224,0.30)",  label: "reads" },
  write:    { color: "rgba(224,122,82,0.40)",  label: "writes" },
};
function fillFor(n) {
  if (n.kind === "domain" || (n.container && n.kind !== "system"))
    return n.depth % 2 ? "#2d2d2d" : "#262626";
  if (n.kind !== "module" && KIND_FILL[n.kind]) return KIND_FILL[n.kind];
  return (n.language && LANG_FILL[n.language.toLowerCase()]) || "#4a6580";
}

// ── State ───────────────────────────────────────────────────────────────
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let transform = d3.zoomIdentity;
let hovered = null, selected = null, activeFlow = null;
const kindOn = Object.fromEntries(Object.keys(EDGE_STYLE).map(k => [k, true]));

// ── Render ──────────────────────────────────────────────────────────────
const MIN_R = 1.5, LABEL_R = 22, REVEAL_R = 55;
let raf = null;
const requestDraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = null; draw(); }); };

function visible(n, k, tx, ty, vw, vh) {
  const sx = n.x * k + tx, sy = n.y * k + ty, sr = n.r * k;
  return sx + sr > -60 && sx - sr < vw + 60 && sy + sr > -60 && sy - sr < vh + 60;
}

const flowNodeSet = () => (activeFlow ? activeFlow._set : null);

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const vw = innerWidth, vh = innerHeight;
  const bw = Math.round(vw * dpr), bh = Math.round(vh * dpr);
  if (canvas.width !== bw) { canvas.width = bw; canvas.style.width = vw + "px"; }
  if (canvas.height !== bh) { canvas.height = bh; canvas.style.height = vh + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#1e1e1e"; ctx.fillRect(0, 0, vw, vh);

  const { x: tx, y: ty, k } = transform;
  const flowSet = flowNodeSet();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // Nodes
  for (const n of nodes) {
    const sr = n.r * k;
    if (sr < MIN_R) continue;
    if (!isRevealed(n, k)) continue; // LOD: reveal children gradually
    if (!visible(n, k, tx, ty, vw, vh)) continue;
    const sx = n.x * k + tx, sy = n.y * k + ty;
    const inFlow = flowSet ? flowSet.has(n.id) : true;
    const isSel = selected === n.id, isHov = hovered === n.id;

    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.globalAlpha = (n.container ? 0.55 : 0.85) * (inFlow ? 1 : 0.18);
    ctx.fillStyle = isSel ? "rgba(204,120,92,0.25)" : fillFor(n);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = isSel ? 2.5 : isHov ? 1.8 : n.container ? 1 : 0.8;
    ctx.strokeStyle = isSel || isHov ? "#cc785c"
      : entrySet.has(n.id) ? "rgba(204,120,92,0.9)"
      : n.container ? "#3a3a3a" : "rgba(212,212,212,0.18)";
    if (entrySet.has(n.id) && !isSel && !isHov) ctx.lineWidth = 1.6;
    if (deadSet.has(n.id)) ctx.setLineDash([5, 4]); // dead-end candidate
    ctx.globalAlpha = inFlow ? 1 : 0.25; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    if (sr > LABEL_R) {
      const fs = Math.min(17, Math.max(9, sr / 6));
      ctx.font = `${n.container ? "600" : "400"} ${fs}px system-ui, sans-serif`;
      ctx.fillStyle = n.container ? "#8a8a8a" : "#e8e8e8";
      ctx.globalAlpha = inFlow ? 1 : 0.3;
      const ly = n.container && sr > 55 ? sy - sr + fs + 5 : sy;
      const label = n.name.length > 28 ? [...n.name].slice(0, 26).join("") + "…" : n.name;
      ctx.fillText(label, sx, ly);
      ctx.globalAlpha = 1;
    }
  }

  // Edges: batched per kind, endpoints must both be on screen
  const vis = id => { const n = byId.get(id); return n && n.r * k > MIN_R * 2 && isRevealed(n, k) && visible(n, k, tx, ty, vw, vh); };
  const curve = (a, b) => {
    const ax = a.x * k + tx, ay = a.y * k + ty, bx = b.x * k + tx, by = b.y * k + ty;
    if ((ax - bx) ** 2 + (ay - by) ** 2 < 120) return;
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo((ax + bx) / 2 + (by - ay) * 0.12, (ay + by) / 2 + (ax - bx) * 0.12, bx, by);
  };
  if (!flowSet) {
    for (const [kind, style] of Object.entries(EDGE_STYLE)) {
      if (!kindOn[kind]) continue;
      const bucket = edgesByKind.get(kind);
      if (!bucket) continue;
      ctx.strokeStyle = style.color; ctx.lineWidth = 0.8; ctx.beginPath();
      let drawn = 0;
      for (const e of bucket) {
        if (!vis(e.source) || !vis(e.target)) continue;
        curve(byId.get(e.source), byId.get(e.target));
        if (++drawn > 1200) break;
      }
      ctx.stroke();
    }
  }

  // Focus edges (hover/selection) in accent, on top
  const focus = hovered || selected;
  if (focus && !flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const e of adjacency.get(focus) || []) {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
  }

  // Active flow: numbered step path
  if (flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 2;
    const seq = activeFlow._seq;
    ctx.beginPath();
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
    seq.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const sx = n.x * k + tx, sy = n.y * k + ty - n.r * k - 10;
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#cc785c"; ctx.fill();
      ctx.fillStyle = "#1e1e1e"; ctx.font = "700 11px system-ui, sans-serif";
      ctx.fillText(String(i + 1), sx, sy + 0.5);
    });
  }
}

// ── Zoom / pan / hit-testing ────────────────────────────────────────────
// Max zoom scales with the smallest leaf so deep estates stay reachable.
const leafRs = nodes.filter(n => !n.container).map(n => n.r);
const MAX_K = Math.max(600, Math.ceil(140 / Math.max(1e-6, Math.min(...leafRs))));
const zoomB = d3.zoom().scaleExtent([0.05, MAX_K]).clickDistance(4)
  .on("zoom", ev => { transform = ev.transform; requestDraw(); })
  .on("start", () => canvas.classList.add("dragging"))
  .on("end", () => canvas.classList.remove("dragging"));
const sel = d3.select(canvas).call(zoomB).on("dblclick.zoom", null);

function hit(mx, my) {
  const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
  let best = null;
  for (const n of nodes) {
    if (n.r * transform.k < MIN_R) continue;
    // Mirror the draw-time LOD rule so hidden nodes can't be clicked.
    if (!isRevealed(n, transform.k)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= n.r * n.r && (!best || n.r < best.r)) best = n;
  }
  return best;
}
let flyGen = 0;
function flyTo(n) {
  const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
