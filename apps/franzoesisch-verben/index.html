<title>Cahier de Verbes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Heft mit Lavendel-Kästchen. Oben ein dunkles Startfeld mit Maskottchen und Tagesziel, darunter ein farbcodierter Lernpfad. Jede Seite hat ihre eigene Farbe, die auf der Theorie und der Übung wiederkehrt. */
:root{
  --paper:#F3F0FF; --card:#FFFFFF; --ink:#2A1A63; --text:#1D1740; --muted:#625C8A;
  --grid-strong:#DCD5F7; --grid-weak:#EAE5FB; --line:#D3CAF2; --shadow:rgba(42,26,99,.18);
  --pen:#D92B4B; --pen-bg:#FFE8EC; --ok:#0F8F66; --ok-bg:#DAF6EA;
  --marker:#FFE066; --note:#FFF2A8; --star:#FFB100; --flame:#F2590F;
  --hero-bg:#2A1A63; --hero-fg:#FFFFFF; --hero-soft:#CFC6FF;
  --btn-bg:#E8365A; --btn-fg:#FFFFFF; --btn-shadow:#9E1B38;
  --sun:#FFC933; --sun-fg:#2A1A63;
  --f-head:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pen:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15102E; --card:#211A45; --ink:#BBAEFF; --text:#F3F0FF; --muted:#ACA5D6;
  --grid-strong:#2A2253; --grid-weak:#1C1640; --line:#3A3070; --shadow:rgba(0,0,0,.45);
  --pen:#FF8496; --pen-bg:#3D2030; --ok:#55DDA6; --ok-bg:#15372F;
  --marker:rgba(255,224,102,.42); --note:#4A411C; --star:#FFD23F; --flame:#FF9442;
  --hero-bg:#33248A; --hero-fg:#FFFFFF; --hero-soft:#D9D2FF;
  --btn-bg:#FF6B88; --btn-fg:#2A0F1A; --btn-shadow:#A93450;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15102E; --card:#211A45; --ink:#BBAEFF; --text:#F3F0FF; --muted:#ACA5D6;
  --grid-strong:#2A2253; --grid-weak:#1C1640; --line:#3A3070; --shadow:rgba(0,0,0,.45);
  --pen:#FF8496; --pen-bg:#3D2030; --ok:#55DDA6; --ok-bg:#15372F;
  --marker:rgba(255,224,102,.42); --note:#4A411C; --star:#FFD23F; --flame:#FF9442;
  --hero-bg:#33248A; --hero-fg:#FFFFFF; --hero-soft:#D9D2FF;
  --btn-bg:#FF6B88; --btn-fg:#2A0F1A; --btn-shadow:#A93450;
  color-scheme:dark}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(var(--grid-weak) 1px,transparent 1px),linear-gradient(90deg,var(--grid-weak) 1px,transparent 1px);
  background-size:100% 32px,100% 8px,32px 100%;
  color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.app{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg.ic{width:1em;height:1em;fill:currentColor;display:block}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:8px 14px;background:var(--card);border:2px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;box-shadow:0 4px 0 var(--shadow)}
.brand{background:none;border:0;cursor:pointer;font-family:var(--f-head);font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--ink);padding:4px 0;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--btn-bg);box-shadow:8px 4px 0 -2px var(--sun)}
.alla{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:20px;padding:2px 12px}
.stats{display:flex;align-items:center;gap:14px}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.xpbar{width:90px;height:10px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn-bg),var(--sun));transition:width .4s}
.streak{display:flex;align-items:center;gap:3px;font-weight:600;color:var(--flame);font-size:19px}
.streak b{font-size:15px;color:var(--text)}

main{padding-top:22px;display:grid;gap:26px}
h1,h2,h3{margin:0;font-family:var(--f-head);color:var(--ink);font-weight:800;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(30px,7vw,46px)}
h2{font-size:26px}
h3{font-size:21px}
.kicker{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 var(--shadow);padding:18px}

.mk{background:linear-gradient(transparent 55%,var(--marker) 55%)}
.btn{cursor:pointer;font-weight:600;border:2px solid var(--ink);background:var(--btn-bg);color:var(--btn-fg);padding:12px 24px;border-radius:12px;box-shadow:0 5px 0 var(--btn-shadow);transition:transform .08s,box-shadow .08s;font-size:16px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--btn-shadow)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.btn.sun{background:var(--sun);color:var(--sun-fg);box-shadow:0 5px 0 #B8860B;border-color:var(--sun-fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.hero{background:var(--hero-bg);color:var(--hero-fg);border-color:var(--ink);display:grid;gap:16px;overflow:hidden;position:relative}

.hero .name{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hero .name input{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--hero-soft);background:var(--hero-bg);color:var(--hero-fg);min-width:0;flex:1 1 140px}

.goalbox{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:rgba(255,255,255,.2)}.ring .p{stroke:var(--sun);transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head);font-size:19px;font-weight:800;text-align:center;line-height:1}
.goalbox p{margin:0;font-size:14px;color:var(--hero-soft)}
.goalbox p strong{color:var(--hero-fg);display:block;font-size:17px;font-family:var(--f-head);font-weight:800}
.goalbox .btn{margin-left:auto}

.path{display:grid;gap:14px;position:relative}
.path::before{content:"";position:absolute;left:46px;top:30px;bottom:30px;border-left:3px dashed var(--line)}
.node{position:relative;display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 var(--shadow);padding:12px 16px;transition:transform .1s}
.node:hover{transform:translate(-1px,-2px)}
.node .circ{width:60px;height:60px;border-radius:18px;border:2px solid var(--ink);background:var(--lc);color:#1B1240;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:22px;line-height:1;transform:rotate(-4deg)}
.node h3{font-size:22px}
.node small{display:block;color:var(--muted);font-size:13px}
.node .go{font-size:13px;font-weight:600;color:var(--ink)}
.stars{display:flex;gap:2px;font-size:24px;color:var(--line)}
.stars .on{color:var(--star)}
.c-etre{--lc:#9B7BFF}.c-avoir{--lc:#FF6B88}.c-aller{--lc:#3DD6B0}.c-faire{--lc:#4CC3F5}.c-er{--lc:#FFC933}.c-irre{--lc:#FF8AD0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.modes .card{display:grid;gap:10px;align-content:start}
.modes p{margin:0;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--card);opacity:.55}
.badge.got{opacity:1;border:2px solid var(--ink);box-shadow:3px 4px 0 var(--shadow);background:linear-gradient(135deg,var(--card),var(--note))}
.badge b{display:block;font-family:var(--f-head);font-weight:800;font-size:16px;line-height:1.15;color:var(--ink)}
.badge span{font-size:12px;color:var(--muted)}

.back{justify-self:start}
.tcard{border-top:10px solid var(--lc)}
.thead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.thead .de{font-size:17px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:500;font-size:15px}
.chip.on{background:var(--ink);color:var(--paper)}
.conj{width:100%;border-collapse:collapse}
.conj td{padding:9px 6px;border-bottom:1.5px dashed var(--line);vertical-align:middle}
.conj tr:last-child td{border-bottom:0}
.conj .pr{color:var(--muted);width:34%;text-align:right;padding-right:10px;font-size:15px}
.conj .fm{font-size:24px;font-weight:600;min-width:130px}
.conj .third{color:var(--muted);font-size:14px}
.conj .sp{width:36px;text-align:right}
.conj .stem{font-weight:600}
.conj .end{background:linear-gradient(transparent 50%,var(--marker) 50%)}
.conj .fm .qm{display:none;color:var(--muted);font-size:15px}
.conj .fm.hid{cursor:pointer;background:var(--paper);border-radius:8px}
.conj .fm.hid .val{display:none}
.conj .fm.hid .qm{display:inline}
.say{background:none;border:0;cursor:pointer;color:var(--ink);font-size:20px;padding:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.note{background:var(--note);padding:12px 14px;box-shadow:3px 4px 0 var(--shadow);font-size:14px;transform:rotate(-.5deg);border-radius:4px}
.note:nth-child(even){transform:rotate(.6deg)}
.note b{display:block;font-family:var(--f-head);font-weight:800;font-size:17px;line-height:1.15;color:var(--ink);margin-bottom:2px}
.ex{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1.5px dashed var(--line);padding-bottom:8px}
.ex li:last-child{border-bottom:0;padding-bottom:0}
.ex .fr{font-size:18px;font-weight:500}
.ex .de{font-size:13px;color:var(--muted)}

.playbar{display:flex;align-items:center;gap:12px}
.x{width:42px;height:42px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center;flex:none}
.pbar{flex:1;height:16px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.pbar i{display:block;height:100%;background:var(--lc,var(--btn-bg));transition:width .3s}
.hearts{display:flex;gap:2px;font-size:22px}
.h.on{color:var(--pen)}.h.off{color:var(--line)}
.combo{font-size:14px;font-weight:600;color:var(--flame);min-height:22px}
.qcard{border-top:10px solid var(--lc,var(--ink));margin-top:-8px}
.qlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 8px}
.vchip{display:inline-block;margin:0 0 12px;padding:2px 12px;border:1.5px solid var(--line);border-radius:14px;font-size:13px;color:var(--muted)}
.vchip b{color:var(--ink)}
.sentence{font-size:clamp(22px,5.4vw,30px);font-weight:500;line-height:1.35;margin:0 0 4px}
.tr{font-size:14px;color:var(--muted);margin:2px 0 14px}
.blank{display:inline-block;min-width:84px;text-align:center;border-bottom:3px solid var(--ink);color:var(--ink);font-weight:600;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:19px;font-weight:500;box-shadow:0 4px 0 var(--line)}
.opt kbd{font:600 12px var(--f-body);color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:0 6px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--pen);background:var(--pen-bg);box-shadow:0 4px 0 var(--pen)}
.opt:disabled{cursor:default}
.ans{font-family:var(--f-body);font-size:22px;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--text)}
.ans.ok{border-color:var(--ok);background:var(--ok-bg)}.ans.bad{border-color:var(--pen);background:var(--pen-bg);text-decoration:line-through}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acc .chip{padding:2px 12px;font-size:18px;border-radius:10px}
.big{font-family:var(--f-head);font-weight:800;font-size:clamp(30px,8vw,46px);color:var(--ink);line-height:1.1;margin:0 0 10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin-top:6px}
.mb{cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:19px;font-weight:500;box-shadow:0 4px 0 var(--line)}
.mb.sel{border-color:var(--ink);background:var(--marker)}
.mb.dn{border-color:var(--ok);background:var(--ok-bg);cursor:default;box-shadow:none}
.mb.shake{animation:shake .35s;border-color:var(--pen)}
.mini{border-collapse:collapse;font-size:15px}
.mini td{padding:2px 12px 2px 0}.mini td:first-child{color:var(--muted)}
.peek{background:var(--note);padding:10px 14px;box-shadow:3px 3px 0 var(--shadow);margin-top:8px;display:inline-block;border-radius:4px}
.foot{position:sticky;bottom:0;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 18px)}
.foot .row{display:flex;justify-content:flex-end}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border:2px solid;border-radius:14px}
.fb .mas{flex:none;width:56px}
.fb .msg{flex:1 1 200px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.almost{background:var(--note);border-color:var(--star)}
.fb.bad{background:var(--pen-bg);border-color:var(--pen)}
.fb .gain{font-size:13px;font-weight:600;color:var(--muted)}
.fb .tr{margin:2px 0 0}
.pen{font-family:var(--f-pen);font-weight:700;font-size:27px;color:var(--pen);line-height:1.1}
.fb .why{font-size:14px;margin-top:4px}
.timer{height:16px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.timer i{display:block;height:100%;width:100%;background:var(--flame)}
.score{font-family:var(--f-head);font-weight:800;font-size:30px;color:var(--ink);line-height:1;min-width:64px;text-align:right}

.res{text-align:center;display:grid;gap:14px;justify-items:center}
.res .mas{width:110px}
.rstars{display:flex;gap:6px;font-size:68px;color:var(--line)}
.rstars .on{color:var(--star);animation:pop .5s both}
.rstars .on:nth-child(2){animation-delay:.18s}.rstars .on:nth-child(3){animation-delay:.36s}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.fact{border:2px solid var(--line);border-radius:12px;padding:8px 16px;min-width:110px}
.fact b{display:block;font-family:var(--f-head);font-weight:800;font-size:28px;color:var(--ink);line-height:1.1}
.fact span{font-size:12px;color:var(--muted)}
.gline{width:100%;max-width:420px;font-size:14px}
.gline .bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:4px;background:var(--card)}
.gline .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn-bg),var(--sun))}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.lvup{background:var(--marker);padding:6px 16px;border-radius:8px;font-family:var(--f-head);font-weight:800;font-size:20px;color:var(--ink);transform:rotate(-1.5deg)}
.cf{position:fixed;top:-16px;width:10px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.hero .mas{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
.hero .mas{width:92px}
@media (max-width:520px){.conj .third{display:none}.conj .pr{width:30%}.node{grid-template-columns:52px 1fr}.node .circ{width:52px;height:52px;font-size:19px}.node .stars{grid-column:2}.path::before{left:42px}.hero .row1{grid-template-columns:70px 1fr}.hero .mas{width:70px}.goalbox .btn{margin-left:0;width:100%}}
</style>

<script>
(function(){
'use strict';
const ER=['e','es','e','ons','ez','ent'],IR=['is','is','it','issons','issez','issent'],RE=['s','s','','ons','ez','ent'];
const GE={er:ER,ir:IR,re:RE};
const PRON=['je','tu','il / elle / on','nous','vous','ils / elles'];
const PQV=[['je'],['tu'],['il','elle','on'],['nous'],['vous'],['ils','elles']];
const V={
 etre:{inf:'être',de:'sein',forms:['suis','es','est','sommes','êtes','sont'],deF:['ich bin','du bist','er/sie/es ist','wir sind','ihr seid','sie sind']},
 avoir:{inf:'avoir',de:'haben',forms:['ai','as','a','avons','avez','ont'],deF:['ich habe','du hast','er/sie/es hat','wir haben','ihr habt','sie haben']},
 aller:{inf:'aller',de:'gehen',forms:['vais','vas','va','allons','allez','vont'],deF:['ich gehe','du gehst','er/sie/es geht','wir gehen','ihr geht','sie gehen']},
 faire:{inf:'faire',de:'machen',forms:['fais','fais','fait','faisons','faites','font'],deF:['ich mache','du machst','er/sie/es macht','wir machen','ihr macht','sie machen']},
 parler:{de:'sprechen',stem:'parl',group:'er'},
 aimer:{de:'mögen, lieben',stem:'aim',group:'er'},
 habiter:{de:'wohnen',stem:'habit',group:'er'},
 jouer:{de:'spielen',stem:'jou',group:'er'},
 chanter:{de:'singen',stem:'chant',group:'er'},
 regarder:{de:'anschauen',stem:'regard',group:'er'},
 ecouter:{inf:'écouter',de:'zuhören',stem:'écout',group:'er'},
 finir:{de:'beenden',stem:'fin',group:'ir'},
 choisir:{de:'wählen',stem:'chois',group:'ir'},
 attendre:{de:'warten',stem:'attend',group:'re'},
 repondre:{inf:'répondre',de:'antworten',stem:'répond',group:'re'},
 vendre:{de:'verkaufen',stem:'vend',group:'re'}
};

function hint(v,p){

  return [...tr.slice(0,1),...pool].filter((x,i,a)=>a.indexOf(x)===i).slice(0,n);
}

function miniTable(v){return `<table class="mini">${[0,1,2,3,4,5].map(i=>`<tr><td>${esc(lab(v,i))}</td><td><b>${esc(v.forms[i])}</b></td></tr>`).join('')}</table>`}
const accents=()=>`<div class="acc">${['é','è','ê','à','â','ç','î','ï','ô','û','œ'].map(c=>`<button class="chip" data-act="ch" data-c="${c}" type="button">${c}</button>`).join('')}</div>`;

    <div style="display:grid;gap:10px">${q.left.map((l,i)=>`<button class="mb ${m.doneL[i]?'dn':''} ${m.selL===i?'sel':''}" ${fb?'disabled':''} data-act="mleft" data-i="${i}">${esc(l)}</button>`).join('')}</div>
    <div style="display:grid;gap:10px">${q.right.map((r,j)=>`<button class="mb ${m.doneR[j]?'dn':''} ${m.flash===j?'shake':''}" ${fb?'disabled':''} data-act="mright" data-j="${j}">${esc(r)}</button>`).join('')}</div></div>`;

function correctLine(q){

function fbHTML(q){

function renderPlay(){
  renderHeader();
  app.className=run.lesson?'c-'+run.lesson.id:'';
  const q=cur(),fb=run.state==='fb';

  const pct=(run.i+(fb?1:0))/run.qs.length*100;
  let foot;
  if(fb)foot=fbHTML(q);
  else if(q.t==='match')foot=`<p class="muted" style="margin:0;font-size:14px">Tippe links ein Pronomen, dann rechts die passende Form.</p>`;
  else foot=`<div class="row"><button class="btn" id="chk" data-act="check" ${q.t==='type'||q.t==='form'?(run.typed.trim()?'':'disabled'):(run.sel===null?'disabled':'')}>Prüfen</button></div>`;
  const peek=run.peek?`<div class="peek">${miniTable(q.v)}</div>`:'';
  app.innerHTML=`
  <div class="playbar"><button class="x" data-act="home" aria-label="Abbrechen">${ic('close')}</button><div class="pbar"><i style="width:${pct}%"></i></div><div class="hearts" aria-label="${run.hearts} Herzen">${hearts}</div></div>

function settle(kind){
  const q=cur();let gain=0,mult=1;
  if(kind==='ok'){run.correct++;run.combo++;run.bestCombo=Math.max(run.bestCombo,run.combo);mult=multOf(run.combo);gain=10*mult}
  else if(kind==='almost'){run.almost++;gain=5}
  else{run.wrong++;run.combo=0;run.hearts--}
  if(gain){run.xp+=gain;addXP(gain)}
  run.fb={kind,gain,mult};run.state='fb';renderPlay();
}
function check(){
  if(run.state!=='ask')return;
  const q=cur();let kind;
  if(q.t==='choice'||q.t==='end'){if(run.sel===null)return;kind=q.opts[run.sel]===q.ans?'ok':'bad'}
  else if(q.t==='sent'){if(run.sel===null)return;kind=q.opts[run.sel].f===q.ans?'ok':'bad'}
  else if(q.t==='type'||q.t==='form'){
    const raw=($('#ans')||{value:''}).value;if(!raw.trim())return;run.typed=raw;
    const u=stripPron(norm(raw)),a=norm(q.ans);
    kind=u===a?'ok':(stripAcc(u)===stripAcc(a)?'almost':'bad');
  } else return;
  settle(kind);
}
function nextQ(){
  if(run.state!=='fb')return;
  if(run.fb.kind==='bad'&&run.hearts<=0){finish(true);return}
  run.i++;
  if(run.i>=run.qs.length){finish(false);return}
  initQ();renderPlay();window.scrollTo(0,0);
}
function mleft(i){const m=run.m;if(run.state!=='ask'||m.doneL[i])return;m.selL=i;m.flash=-1;renderPlay()}
function mright(j){
  const m=run.m,q=cur();
  if(run.state!=='ask'||m.selL===null||m.doneR[j])return;
  if(q.v.forms[m.selL]===q.right[j]){
    m.doneL[m.selL]=1;m.doneR[j]=1;m.selL=null;m.flash=-1;m.n++;
    if(m.n>=6){settle(m.slips?'almost':'ok');return}
  } else {
    m.slips++;m.flash=j;m.selL=null;
    if(m.slips===1){
      run.combo=0;run.hearts--;
      if(run.hearts<=0){run.wrong++;run.fb={kind:'bad',gain:0,mult:1};run.state='fb'}
    }
  }
  renderPlay();
}
function peek(){
  if(run.state!=='ask')return;
  if(!run.peek&&!run.peeked){run.peeked=true;S.xp=Math.max(0,S.xp-3);save();run.xp=Math.max(0,run.xp-3)}
  run.peek=!run.peek;
  const inp=$('#ans');if(inp)run.typed=inp.value;
  renderPlay();
}

function renderBlitz(){
  renderHeader();app.className='';

    ?`<p class="qlabel">Welche Endung fehlt?</p>${vchip(q)}<p class="big">${esc(q.subj)}${esc(q.v.stem)}<span class="blank">&nbsp;</span></p>`

function bpick(i){
  if(!run||run.lock)return;
  const q=run.q,val=q.opts[i],ok=val===q.ans;
  run.lock=true;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,k)=>{if(q.opts[k]===q.ans)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  if(ok){run.score++;run.combo++;run.bestCombo=Math.max(run.bestCombo,run.combo);const g=5*multOf(run.combo);run.xp+=g;addXP(g)}
  else run.combo=0;
  run.to=setTimeout(()=>{if(view!=='blitz'||!run)return;run.q=blitzQ();run.lock=false;renderBlitz()},ok?280:900);
}
function endBlitz(){
  if(!run||run.mode!=='blitz'||view!=='blitz')return;
  clearInterval(run.timer);clearTimeout(run.to);
  if(run.score>S.blitzBest)S.blitzBest=run.score;
  if(run.score>=10)award('blitz10');
  if(run.bestCombo>=5)award('combo5');
  touchStreak();if(streakNow()>=3)award('streak3');
  save();view='result';renderResult();
}
function finish(failed){
  const total=run.qs.length,acc=(run.correct+.5*run.almost)/total;
  run.failed=failed;run.acc=acc;run.stars=failed?0:(acc>=.9?3:acc>=.7?2:1);
  if(run.mode==='lesson'&&run.stars>(S.stars[run.lesson.id]||0))S.stars[run.lesson.id]=run.stars;
  if(run.mode==='boss'&&!failed){S.boss=true;run.bonus=50;addXP(50);award('boss')}
  if(!failed&&run.wrong===0&&run.almost===0)award('perfect');
  if(run.bestCombo>=5)award('combo5');
  if(Object.keys(S.stars).some(k=>S.stars[k]>0))award('first');
  if(S.stars.etre===3)award('etre3');
  if(['etre','avoir','aller','faire'].every(k=>S.stars[k]>0))award('four');
  if(S.stars.er>0&&S.stars.irre>0)award('regs');
  touchStreak();if(streakNow()>=3)award('streak3');
  save();view='result';renderResult();window.scrollTo(0,0);
}
function renderResult(){
  renderHeader();app.className='';
  const r=run;
  const nb=r.newBadges.map(id=>BADGES.find(b=>b.id===id)).map(b=>`<div class="badge got"><b>${esc(b.n)}</b><span>${esc(b.d)}</span></div>`).join('');
  const lv=r.levelUp?`<div class="lvup">Niveau ${r.levelUp} erreicht · ${esc(TITLES[Math.min(r.levelUp-1,TITLES.length-1)])}</div>`:'';
  let title,sub,facts,acts,mood;
  if(r.mode==='blitz'){
    title=r.score>=10?'Éclair !':'Zeit um';
    sub=`${r.score} richtig in 45 Sekunden. Dein Bestwert liegt bei ${S.blitzBest}.`;
    mood=r.score>=10?'cheer':'happy';
    facts=`<div class="fact"><b>${r.score}</b><span>richtig</span></div><div class="fact"><b>${r.xp}</b><span>XP</span></div><div class="fact"><b>×${multOf(r.bestCombo)}</b><span>bester Combo</span></div>`;
    acts=`<button class="btn" data-act="blitz">Nochmal</button><button class="btn ghost" data-act="home">Zum Lernpfad</button>`;
  } else {
    const fail=r.failed;
    title=fail?'Knapp daneben':(r.stars===3?'Parfait !':r.stars===2?'Très bien !':'Bien joué !');
    sub=fail?'Das passiert jedem. Schau kurz in die Theorie, die nächste Runde läuft besser.':(r.mode==='boss'?'Endgegner besiegt. 50 Bonus-XP gehören dir.':(r.mode==='quick'?'Kurze Runde, echter Fortschritt.':'Seite geschafft. Mit mehr richtigen Antworten gibt es mehr Sterne.'));
    mood=fail?'hmm':(r.stars===3?'cheer':'happy');
    facts=`<div class="fact"><b>${Math.round(r.acc*100)} %</b><span>richtig</span></div><div class="fact"><b>${r.xp+r.bonus}</b><span>XP</span></div><div class="fact"><b>${r.bestCombo}</b><span>längste Serie</span></div>`;
    const again=r.mode==='boss'?`<button class="btn" data-act="boss">Nochmal</button>`:(r.mode==='quick'?`<button class="btn" data-act="quick">Noch eine Runde</button>`:`<button class="btn" data-act="start" data-id="${r.lesson.id}">Nochmal</button>`);
    acts=again+(r.mode==='lesson'?`<button class="btn ghost" data-act="open" data-id="${r.lesson.id}">Theorie</button>`:'')+`<button class="btn ghost" data-act="home">Zum Lernpfad</button>`;
  }
  const x=dailyXP(),goalTxt=x>=GOAL?'Tagesziel geschafft!':`Tagesziel: noch ${GOAL-x} XP`;
  const st=r.mode==='blitz'?'':`<div class="rstars">${[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}">${ic('star')}</span>`).join('')}</div>`;
  app.innerHTML=`<section class="card res">${mascot(mood)}<h1>${esc(title)}</h1>${st}<p style="margin:0;max-width:46ch">${esc(sub)}</p><div class="facts">${facts}</div><div class="gline"><b>${goalTxt}</b><div class="bar"><i style="width:${Math.min(100,x/GOAL*100)}%"></i></div></div>${lv}${nb?`<div><p class="kicker">Neue Trophäen</p><div class="badges" style="justify-content:center">${nb}</div></div>`:''}<div class="acts">${acts}</div></section>`;
  if(r.goalHit||r.mode==='boss'&&!r.failed||(r.mode!=='blitz'&&!r.failed&&r.stars>=2)||(r.mode==='blitz'&&r.score>=10))confetti();
}
function go(v,o){
  if(v==='home'){stopRun();view='home';renderHome()}
  else if(v==='theory'){stopRun();th={id:o.id,verb:null,cover:false};view='theory';renderTheory()}
  window.scrollTo(0,0);
}
const H={
  home(){resetAsk=false;go('home')},
  open(el){go('theory',{id:el.dataset.id})},
  start(el){startLesson(el.dataset.id)},
  boss(){if(bossOpen())startBoss()},
  quick(){stopRun();run=newRun('quick',{qs:buildQuick()});initQ();view='play';renderPlay();window.scrollTo(0,0)},
  savename(){const i=$('#nm');if(i&&i.value.trim()){S.name=i.value.trim().slice(0,20);save();renderHome()}},
  blitz(){startBlitz()},
  verb(el){th.verb=el.dataset.v;renderTheory()},
  cover(){th.cover=!th.cover;renderTheory()},
  reveal(el){el.classList.remove('hid')},
  say(el){speak(el.dataset.t)},
  pick(el){if(run.state!=='ask')return;run.sel=+el.dataset.i;renderPlay()},
  check(){check()},
  next(){nextQ()},
  peek(){peek()},
  mleft(el){mleft(+el.dataset.i)},
  mright(el){mright(+el.dataset.j)},
  bpick(el){bpick(+el.dataset.i)},
  ch(el){const i=$('#ans');if(!i)return;const s=i.selectionStart==null?i.value.length:i.selectionStart,e=i.selectionEnd==null?s:i.selectionEnd;i.value=i.value.slice(0,s)+el.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1);i.dispatchEvent(new Event('input'))},
  reset(){resetAsk=true;renderHome()},
  resetok(){S=defaults();save();resetAsk=false;renderHome()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=H[el.dataset.act];if(f)f(el)});
document.addEventListener('mousedown',e=>{if(e.target.closest('.acc .chip'))e.preventDefault()});
document.addEventListener('input',e=>{
  if(e.target.id!=='ans')return;
  run.typed=e.target.value;
  const c=$('#chk');if(c)c.disabled=!e.target.value.trim();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='nm'&&e.key==='Enter'){H.savename();return}
  if(!run)return;
  const tag=(e.target.tagName||'');
  if(view==='play'){
    if(e.key==='Enter'){
      if(run.state==='fb'){if(tag!=='BUTTON'){e.preventDefault();nextQ()}}
      else if(tag==='INPUT'){e.preventDefault();check()}
    } else if(tag!=='INPUT'&&run.state==='ask'&&/^[1-4]$/.test(e.key)){
      const q=cur();if(q.opts&&q.opts[+e.key-1]!==undefined){run.sel=+e.key-1;renderPlay()}
    }
  } else if(view==='blitz'&&/^[1-4]$/.test(e.key)){bpick(+e.key-1)}
});
renderHome();
})();
</script>
